<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><title>Reader</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="wrap">
<header><div><h1>Reader</h1><p>Lee cualquier texto con voz natural.</p></div><button id="settings">⚙</button></header>
<section id="editor" class="card">
<label for="text">Texto</label>
<textarea id="text" maxlength="100000" placeholder="Pega aquí el texto que quieres escuchar…"></textarea>
<div class="row">
<div class="switches"><button id="normal" class="active">Normal</button><button id="clean">Sin referencias</button></div>
<button id="prepare" class="primary">Preparar lectura</button>
</div>
<p id="info"></p>
</section>
<section id="reader" class="card" hidden>
<div class="readerhead"><span id="count">0 / 0</span><button id="edit">Editar texto</button></div>
<div class="progress"><i id="bar"></i></div>
<article id="view"></article>
<div class="controls"><button id="prev">⏮</button><button id="play" class="play">▶</button><button id="next">⏭</button></div>
<audio id="audio" preload="none"></audio>
</section>
</main>
<dialog id="dlg"><form method="dialog"><div class="dh"><h2>Ajustes</h2><button value="cancel">✕</button></div>
<label>Voz<select id="tts"><option value="server">Voz natural (servidor)</option><option value="browser">Voz del dispositivo</option></select></label>
<label>Velocidad<select id="speed"><option>.8</option><option>.9</option><option selected>1</option><option>1.1</option><option>1.2</option><option>1.35</option><option>1.5</option></select></label>
<label>Tamaño<select id="font"><option value=".9">Pequeño</option><option value="1" selected>Normal</option><option value="1.15">Grande</option><option value="1.3">Muy grande</option></select></label>
<p>El texto no se guarda como documento. El servidor solo recibe cada fragmento necesario para generar su audio.</p>
</form></dialog>
<script src="/app.js?v=1.0.2"></script>
</body></html>
