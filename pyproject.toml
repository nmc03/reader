[project]
name = "nmc-reader"
version = "1.0.0"
description = "Standalone text reader with Edge TTS"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "edge-tts>=7,<8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "ruff>=0.7,<1",
]

[tool.ruff]
target-version = "py312"
